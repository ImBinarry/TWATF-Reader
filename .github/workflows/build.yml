name: Build reader and EPUBs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test correction propagation
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify both EPUB editions and website
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static
          path: dist/
